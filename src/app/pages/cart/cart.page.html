<ion-header>
  <ion-toolbar>
    <ion-title>Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>

    <ion-item *ngFor="let item of items">
      <ion-label>
        <h2>{{ item.product.name }}</h2>
        <p>Cantidad: {{ item.quantity }}</p>
        <p>$ {{ item.product.price }}</p>
      </ion-label>
    </ion-item>

  </ion-list>

</ion-content>

<ion-footer>
  <ion-toolbar>

    <ion-title>
      Total: $ {{ total }}
    </ion-title>

    <ion-button expand="block" (click)="checkout()">
      Finalizar compra
    </ion-button>

  </ion-toolbar>
</ion-footer>
