<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-input
    placeholder="Email"
    [(ngModel)]="email">
  </ion-input>

  <ion-input
    type="password"
    placeholder="Password"
    [(ngModel)]="password">
  </ion-input>

  <ion-button expand="block" (click)="login()">
    Ingresar
  </ion-button>

  <ion-button fill="clear" routerLink="/register">
    Crear cuenta
  </ion-button>

</ion-content>
